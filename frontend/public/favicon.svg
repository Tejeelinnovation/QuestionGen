<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded Deep Forest Green Squircle Tile -->
  <rect width="64" height="64" rx="15" fill="#1F4D3A" />
  
  <!-- Subtle Top Highlight for Modern Glass/App Feel -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />

  <!-- Bold Geometric 'Q' Monogram -->
  <g fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Q ring -->
    <circle cx="27" cy="34" r="14" />
    <!-- Dynamic angled Q tail -->
    <path d="M28 35 L44 49" />
  </g>

  <!-- AI Generation 4-Point Spark in Electric Lime -->
  <path
    d="M 46 5 Q 46 17 57 17 Q 46 17 46 29 Q 46 17 35 17 Q 46 17 46 5 Z"
    fill="#D4F547"
  />

  <!-- Subtle secondary ambient sparklet -->
  <circle cx="34" cy="9" r="1.75" fill="#D4F547" opacity="0.85" />
</svg>