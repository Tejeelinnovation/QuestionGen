name: Document AI Extraction Worker

on:
  repository_dispatch:
    types: [extract_document]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Django IngestionJob ID'
        required: true
        type: string
      pdf_url:
        description: 'Direct or Google Drive URL of PDF'
        required: true
        type: string
      callback_url:
        description: 'Django Webhook Callback URL'
        required: true
        type: string
      document_kind:
        description: 'TEXTBOOK or HANDWRITTEN_NOTES'
        required: false
        default: 'TEXTBOOK'
        type: string

jobs:
  extract:
    name: Extract Textbook Content (16GB RAM Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Hugging Face & Marker Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/datalab
          key: ${{ runner.os }}-marker-models-v1
          restore-keys: |
            ${{ runner.os }}-marker-models-

      - name: Install llama.cpp (llama-server) for Surya AI OCR
        run: |
          echo "Installing llama-server binary for Surya / Marker AI..."
          mkdir -p /tmp/llama-cpp
          curl -sL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b11372/llama-b11372-bin-ubuntu-x64.tar.gz -o /tmp/llama-cpp/llama.tar.gz
          tar -xzf /tmp/llama-cpp/llama.tar.gz -C /tmp/llama-cpp --strip-components=1
          sudo cp /tmp/llama-cpp/llama-server /usr/local/bin/
          sudo cp /tmp/llama-cpp/*.so* /usr/local/lib/ 2>/dev/null || true
          sudo ldconfig
          echo "LLAMA_CPP_BINARY=/usr/local/bin/llama-server" >> $GITHUB_ENV
          echo "Verifying llama-server binary:"
          /usr/local/bin/llama-server --version || true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r document_ai_worker/requirements.txt

      - name: Execute Document AI Extraction
        env:
          LLAMA_CPP_BINARY: /usr/local/bin/llama-server
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
          PDF_URL: ${{ github.event.client_payload.pdf_url || inputs.pdf_url }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || inputs.callback_url }}
          DOCUMENT_KIND: ${{ github.event.client_payload.document_kind || inputs.document_kind || 'TEXTBOOK' }}
          WEBHOOK_SECRET: ${{ secrets.INGESTION_WEBHOOK_SECRET || '' }}
          DRIVE_TOKEN_JSON: ${{ github.event.client_payload.drive_token_json || secrets.GOOGLE_DRIVE_USER_TOKEN_JSON || '' }}
          DRIVE_FOLDER_ID: ${{ github.event.client_payload.drive_folder_id || secrets.GOOGLE_DRIVE_FOLDER_ID || '' }}
        run: |
          echo "Starting Document AI Worker for Job #$JOB_ID..."
          PYTHONPATH=document_ai_worker python document_ai_worker/cli_extractor.py \
            --job-id "$JOB_ID" \
            --pdf-url "$PDF_URL" \
            --callback-url "$CALLBACK_URL" \
            --document-kind "$DOCUMENT_KIND" \
            --webhook-secret "$WEBHOOK_SECRET"

      - name: Report Failure to Backend Webhook
        if: failure()
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || inputs.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.INGESTION_WEBHOOK_SECRET || '' }}
        run: |
          if [ -n "$CALLBACK_URL" ]; then
            echo "Notifying Django backend of runner failure: $CALLBACK_URL"
            curl -s --retry 3 --retry-delay 5 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Ingestion-Secret: $WEBHOOK_SECRET" \
              -d "{\"job_id\": \"$JOB_ID\", \"status\": \"FAILED\", \"error_message\": \"GitHub Actions runner workflow failed during extraction. Check GitHub Actions workflow run logs for full details.\"}" || true
          fi
