name: Document AI Extraction Worker

on:
  repository_dispatch:
    types: [extract_document]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Django IngestionJob ID'
        required: true
        type: string
      pdf_url:
        description: 'Direct or Google Drive URL of PDF'
        required: true
        type: string
      callback_url:
        description: 'Django Webhook Callback URL'
        required: true
        type: string
      document_kind:
        description: 'Document Kind (AUTO, TEXTBOOK, NEWSPAPER, etc.)'
        required: false
        default: 'AUTO'
        type: string

jobs:
  extract:
    name: Extract Textbook Content (16GB RAM Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'


      - name: Cache Hugging Face, Docling & EasyOCR Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/docling
            ~/.EasyOCR
          key: ${{ runner.os }}-document-ai-models-v1
          restore-keys: |
            ${{ runner.os }}-document-ai-models-

      - name: Install System Libraries & Google Tesseract OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 \
            tesseract-ocr \
            tesseract-ocr-hin \
            tesseract-ocr-ben \
            tesseract-ocr-guj \
            tesseract-ocr-mar \
            tesseract-ocr-tam \
            tesseract-ocr-tel

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python-headless
          pip install -r document_ai_worker/requirements.txt

      - name: Execute Document AI Extraction
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
          PDF_URL: ${{ github.event.client_payload.pdf_url || inputs.pdf_url }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || inputs.callback_url }}
          DOCUMENT_KIND: ${{ github.event.client_payload.document_kind || inputs.document_kind || 'AUTO' }}
          WEBHOOK_SECRET: ${{ secrets.INGESTION_WEBHOOK_SECRET || '' }}
          DRIVE_TOKEN_JSON: ${{ github.event.client_payload.drive_token_json || secrets.GOOGLE_DRIVE_USER_TOKEN_JSON || '' }}
          DRIVE_FOLDER_ID: ${{ github.event.client_payload.drive_folder_id || secrets.GOOGLE_DRIVE_FOLDER_ID || '' }}
          GEMINI_API_KEY: ${{ github.event.client_payload.gemini_api_key || secrets.GEMINI_API_KEY || '' }}
        run: |
          echo "Starting Document AI Worker for Job #$JOB_ID..."
          PYTHONPATH=document_ai_worker python document_ai_worker/cli_extractor.py \
            --job-id "$JOB_ID" \
            --pdf-url "$PDF_URL" \
            --callback-url "$CALLBACK_URL" \
            --document-kind "$DOCUMENT_KIND" \
            --webhook-secret "$WEBHOOK_SECRET" \
            --gemini-api-key "$GEMINI_API_KEY"

      - name: Report Failure to Backend Webhook
        if: failure()
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || inputs.callback_url }}
          WEBHOOK_SECRET: ${{ secrets.INGESTION_WEBHOOK_SECRET || '' }}
        run: |
          if [ -n "$CALLBACK_URL" ]; then
            echo "Notifying Django backend of runner failure: $CALLBACK_URL"
            python -c "
          import hashlib, hmac, json, os, requests, time
          url = os.environ.get('CALLBACK_URL', '')
          job_id = os.environ.get('JOB_ID', '')
          secret = os.environ.get('WEBHOOK_SECRET', '')
          payload = {'job_id': job_id, 'status': 'FAILED', 'error_message': 'GitHub Actions runner workflow failed during extraction. Check GitHub Actions workflow run logs for full details.'}
          raw = json.dumps(payload).encode('utf-8')
          headers = {'Content-Type': 'application/json'}
          if secret:
              ts_str = str(int(time.time()))
              to_sign = f'{ts_str}.'.encode('utf-8') + raw
              sig = hmac.new(secret.encode('utf-8'), to_sign, hashlib.sha256).hexdigest()
              headers['X-Ingestion-Timestamp'] = ts_str
              headers['X-Ingestion-Signature'] = f'sha256={sig}'
          try:
              requests.post(url, data=raw, headers=headers, timeout=15)
          except Exception as e:
              print('Failed notifying webhook:', e)
          " || true
          fi
